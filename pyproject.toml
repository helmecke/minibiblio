[project]
name = "minibiblio-api"
version = "0.1.0"
description = "FastAPI backend for minibiblio"
requires-python = ">=3.9"
dependencies = [
  "alembic>=1.16.5",
  "asyncpg>=0.31.0",
  "bcrypt>=4.0.0",
  "fastapi>=0.128.8",
  "pydantic-settings>=2.11.0",
  "pydantic[email]>=2.12.4",
  "python-jose[cryptography]>=3.5.0",
  "python-multipart>=0.0.20",
  "rich>=14.2.0",
  "sqlalchemy[asyncio]>=2.0.49",
  "uvicorn[standard]>=0.39.0",
]

[tool.ruff.lint]
# Keep the initial gate focused on correctness; broader style cleanup is separate work.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.16.7",
]
